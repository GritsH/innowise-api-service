spring.application.name=api-gateway

server.port=8085

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

spring.cloud.gateway.server.webflux.routes[0].id=user-service-users
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/api/users(?<segment>/?.*), /v1/users${segment}

spring.cloud.gateway.server.webflux.routes[1].id=user-service-cards
spring.cloud.gateway.server.webflux.routes[1].uri=${USER_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/cards/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/api/cards(?<segment>/?.*), /v1/cards${segment}

spring.cloud.gateway.server.webflux.routes[2].id=order-service-orders
spring.cloud.gateway.server.webflux.routes[2].uri=${ORDER_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/api/orders(?<segment>/?.*), /v1/orders${segment}

spring.cloud.gateway.server.webflux.routes[3].id=order-service-items
spring.cloud.gateway.server.webflux.routes[3].uri=${ORDER_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/items/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/api/items(?<segment>/?.*), /v1/items${segment}

spring.cloud.gateway.server.webflux.routes[4].id=authentication-service
spring.cloud.gateway.server.webflux.routes[4].uri=${AUTHENTICATION_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/api/auth(?<segment>/?.*), /v1/auth${segment}

spring.cloud.gateway.server.webflux.routes[5].id=payment-service-payments
spring.cloud.gateway.server.webflux.routes[5].uri=${PAYMENT_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/api/payments(?<segment>/?.*), /api/v1/payments${segment}