services:

  # ==============API Gateway=================
  api-gateway:
    extra_hosts:
      - "keycloak.local:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      AUTHENTICATION_SERVICE_URL: ${AUTHENTICATION_SERVICE_URL}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
    depends_on:
      user-service:
        condition: service_started
      order-service:
        condition: service_started
      authentication-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - default

  # =================User Service=================
  user-service:
    extra_hosts:
      - "keycloak.local:host-gateway"
    build:
      context: ../../user-service/user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      DB_DATASOURCE_URL: ${USER_DB_DATASOURCE_URL}
      DB_USER: ${USER_DB_USER}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      DB_NAME: ${USER_DB_NAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
    depends_on:
      user-service-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  # ==============User Service Postgres=================
  user-service-postgres:
    image: postgres:17
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - user-service-postgres-data:/var/lib/postgresql/data
      - ../../user-service/user-service/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - default

  # ================Order Service=================
  order-service:
    extra_hosts:
      - "keycloak.local:host-gateway"
    build:
      context: ../../oder-service/order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: docker
      DB_DATASOURCE_URL: ${ORDER_DB_DATASOURCE_URL}
      DB_USER: ${ORDER_DB_USER}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      DB_NAME: ${ORDER_DB_NAME}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      order-service-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - default

  # ==========Order Service Postgres================
  order-service-postgres:
    image: postgres:17
    container_name: order-service-postgres
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - order-service-postgres-data:/var/lib/postgresql/data
      - ../../oder-service/order-service/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - default

  # =================Authentication Service==================
  authentication-service:
    extra_hosts:
      - "keycloak.local:host-gateway"
    build:
      context: ../../authentication-service/authentication-service
      dockerfile: Dockerfile
    container_name: authentication-service
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      keycloak:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - default

  # =================Keycloak=================
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    command: start-dev
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: keycloak.local
      KC_HOSTNAME_PORT: 8081
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - default

  # =================Redis=================
  redis:
    image: redis:7
    container_name: user-service-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        ["CMD", "redis-cli","-a", "${REDIS_PASSWORD}", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

 # =================Payment Servic=================
  payment-service:
    extra_hosts:
      - "keycloak.local:host-gateway"
    build:
      context: ../../payment-service/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    environment:
      SERVER_PORT: 8086
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URI: ${PAYMENT_MONGODB_URI}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      API_GATEWAY_URL: ${API_GATEWAY_URL}
    depends_on:
      payment-service-mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - default

  # =================Payment Service Mongo=================
  payment-service-mongodb:
    image: mongo:8.0
    container_name: payment-service-mongodb
    volumes:
      - payment-service-mongodb-data:/data/db
    healthcheck:
      test:
        ["CMD-SHELL","mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  #=================Kafka====================
  kafka:
    image: apache/kafka:4.0.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - default

volumes:
  user-service-postgres-data:
  order-service-postgres-data:
  payment-service-mongodb-data:
  kafka-data:
  redis-data:
  keycloak-data:

networks:
  default:
    name: innowise-network
    external: true